`welcome to <r style="text-decoration:underline">fogulum</r>, a new js image editor engine made by crustulum.
this is an image editor that uses javascript to create effects. this is the manual and credits.
the ui may look very complicated, but, as you use this engine, many things will make sense and will be easy to use.

effects are executed from left to right.
pixel data is stored as [<font color="#f00">R</font>,<font color="#0f0">G</font>,<font color="#00f">B</font>,A], these numbers range from 0-255.
the initial image has the whole thing being [0,0,0,0] and has a specific resolution.
for every pixel, you must return [<font color="#f00">R</font>,<font color="#0f0">G</font>,<font color="#00f">B</font>,A]. this denotes the color of the pixel of the new image

<r style="text-decoration:underline">variables =></r>
<font color="#f0f">c</font> - the pixel data at that point of the image [<font color="#f00">R</font>,<font color="#0f0">G</font>,<font color="#00f">B</font>,A].
<font color="#ff0">x</font>, <font color="#0ff">y</font> - the coordinates of the pixel. minimum is 0, at the top left.
<font color="#ff8">w</font>, <font color="#8ff">h</font> - the width and height of the render.
<font color="#f80">t</font> - the current unix epoch in milliseconds (Date.now()).
<font color="#f08">getPixel(x,y,i)</font> - the pixel in the (x,y) coordinate at the image index i. -1 refers to the current image. [<font color="#f00">R</font>,<font color="#0f0">G</font>,<font color="#00f">B</font>,A].

<r style="text-decoration:underline">what do the buttons do? =></r>
<i>upload images</i> - upload one or more images into the project. the pixels in the images can be used in effects by getPixel.
<i>import project</i> - upload one text file to load a project.

<i>+add</i> - add a effect. this defaults to <i>return c</i> which returns the image unchanged.
<i>-sub</i> - delete the selected effect.
<i>*dup</i> - duplicate the selected effect to the right.
<i>/dis</i> - disable the selected effect. the effect will be ignored until you toggle it back on.
<i>&lt;lef</i> - shift the effect one place to the left.
<i>rig&gt;</i> - shift the effect one place to the right.
<i>:nam</i> - opens a window to rename the selected effect.

the block in the middle is the code of the selected effect.
the two numbers right below the effect code indicate the resolution of the render, width x height.

<i>render</i> - renders the final image from the initial image using the effects.
<i>copy</i> - copies the render to clipboard.
<i>download</i> - downloads the image to local device.
<i>auto-render</i> - toggles auto-rendering. this makes renders happen as fast as possible, creating a dynamic effect.
<i>clear images</i> - removes the images stored in the memory.
<i>save</i> - saves the entire project (effects, images, and resolution) to the browser. reloading will load the project back.
<i>export</i> - saves the entire project (effects, images, and resolution) to local device.

<r style="text-decoration:underline">gifs =></r>

when you first click on the "gif" button, three new values will appear. these correspond to
the number of frames, the frames per second, and the quality of the image.
note that the lower the number, the better quality.
there is an extra variable, <font color="#0f8">V</font>, which starts at 1 and counts up.
<font color="#0f8">V</font> = 1 at frame 1, <font color="#0f8">V</font> = 2 at frame 2, etc.
click the <i>export as gif</i> button to start rendering the frames. while rendering, click on it again to stop rendering.

<r style="text-decoration:underline">credits =></r>
id like to thank deca quitin for the core parts of the engine.
you can visit the original <a href="https://quitin.github.io/projects/html/media-workstation/image-editor/image-editor.html" style="color:#ff0">here</link>.`

f = document.createElement("canvas")

f.setAttribute("height","1px")

ff = f.getContext('2d',{willReadFrequently:true})

imgs = []; imgsdata = []; V = 1
function rcanvas() {
    f.width = 1; f.height = 1
    ff.clearRect(0,0,1,1)
}
function processImages() {
    document.getElementById("images").textContent = ""
    ss = document.getElementById("upload").files
    for (let s of ss) if (!s) return
    let imagesname = []
    for (let s of ss) imagesname.push(s.name)
    imgs = []; imgsdata = []
    for (let si = 0; si < ss.length; si++) {
        s = ss[si]
        rdr = new FileReader()
        rdr.onload = (event) => {  
            let im = new Image()
            im.src = event.target.result
            im.onload = () => {
                f.width = im.width; f.height = im.height
                document.getElementById("images").textContent += `(${si}) ${imagesname[si]}: ${f.width}x${f.height}\n`
                imgsdata.push({w:im.width,h:im.height,s:im.src,n:imagesname[si]})
                ff.clearRect(0,0,f.width,f.height)
                ff.drawImage(im,0,0)
                let ig = ff.getImageData(0,0,f.width,f.height)
                imgs.push(ig)
            }
        }
        rdr.readAsDataURL(s)
    }
    rcanvas()
    setStatus("processed image(s)")
}
function ecanvas(w,h) {
    let ik = new Image(w,h)
    ik.src = ""
    f.width = w; f.height = h
    ff.clearRect(0,0,f.width,f.height)
    ff.drawImage(ik,0,0,ik.width,ik.height,0,0,f.width,f.height)
}
function render() {
    setStatus("rendering")
    let tt = Date.now()
    ff.clearRect(0,0,f.width,f.height)
    ecanvas(Number(document.getElementById("width").value),
            Number(document.getElementById("height").value))
    X = ff.getImageData(0,0,f.width,f.height)
    let w = f.width
    let h = f.height
    for (let ii = 0; ii < effs.length; ii++) {
        let F = null
        try {
            F = new Function("x","y","t","c","w","h",ii==selectedEff?document.getElementById("code").value:effs[ii].c) }
 	catch (error) {
            setStatus(`there was an error parsing effect #${ii+1}:\n${error.stack}`)
            rcanvas()
            return 
        }
        nd = []
        for (let i = 0; i < w * h; i++) { try {
            let x = i % w
            let y = ~~(i / h)
            let c = [X.data[i*4],X.data[i*4+1],X.data[i*4+2],X.data[i*4+3]]
            c = F(x,y,tt,c,w,h)
            if (typeof c == 'number') {
                c = [(c>>16)&255,(c>>8)&255,c&255,255]
            }
            nd[i*4] = c[0]
            nd[i*4+1] = c[1]
            nd[i*4+2] = c[2]
            nd[i*4+3] = c[3]
        } catch (error) {
            setStatus(`there was an error rendering:\n${error.stack}`)
            rcanvas()
            return 
        } }
        for (let k = 0; k < nd.length; k++) {
            X.data[k] = nd[k]
        }
    }
    ff.putImageData(X,0,0)
    if (constructinggif) {
        setStatus(`rendered frame ${V} of ${document.getElementById("gif_frames").value} (${(V/Number(document.getElementById("gif_frames").value)*100).toFixed(2)}) in ${(Date.now()-tt)/1000}s`)
        GIF.addFrame(ff, false); V++
        if (V > Number(document.getElementById("gif_frames").value)) {
            GIF.finish()
            constructinggif = false; V = 1; autoRendering = false
            vg = GIF
            GIF.download("fogulum_gif")
            document.getElementById("gifexportdo").textContent = "export as gif"
            setStatus("downloaded rendered gif")
        }
    } else {
        setStatus(`rendered in ${(Date.now()-tt)/1000}s`)
    }
}
function copyImage() {
    f.toBlob((blob)=>{
        const item = new ClipboardItem({"image/png": blob})
        navigator.clipboard.write([item])
    })
    setStatus("copied")
}
function downloadImage() {
    let dwl = document.createElement("a")
    dwl.setAttribute("download", "fogulum_image.png")
    f.toBlob((blob)=>{
        let url = URL.createObjectURL(blob)
        dwl.setAttribute("href", url)
        dwl.click()
    })
    setStatus("downloaded")
}
function getPixel(x,y,i) {
    if (imgs[i] == undefined) return [0,0,0,0]
    if (i == undefined) i = 0
    let fi = Math.floor
    let imgr = i==-1?X:imgs[i]
    let w = imgr.width
    let L = (fi(x)-w*fi(x/w))+(fi(y)-w*fi(y/w))*w
    return imgr.data.slice(L*4,L*4+4)
}
selectedEff = 0
effs = [{t: "#", c: "return [127,0,255,255]", d: false}]
function manageEff(u) {
    if (u == 1) addEff("#","return c",false)
    else if (u == 2) subEff()
    else if (u == 3) dupEff()
    else if (u == 4) disEff()
    else if (u == 5) lefEff()
    else if (u == 6) rigEff()
    else if (u == 7) namEff()
}
function addEff(title,code,disabled) {
    if (effs.length == 0) {
        document.getElementById("code").value = code
    }
    effs.push({t: title, c: code, d: disabled})
    updEff()
}
function subEff() {
    if (effs.length == 0) return
    let neffs = []
    for (let i = 0; i < effs.length; i++) {
        if (i != selectedEff) {
            neffs.push(effs[i])
        }
    }
    document.getElementById("code").value = effs[selectedEff].c
    effs = neffs
    selEff(Math.max(0,selectedEff-1),false)
    updEff()
}
function dupEff() {
    if (effs.length == 0) return
    let neffs = []
    for (let i = 0; i < effs.length; i++) {
        if (i == selectedEff) neffs.push(effs[i])
        neffs.push(effs[i])
    }
    effs = neffs
    selEff(Math.max(0,selectedEff+1),false)
    updEff()
}
function disEff() {
    if (effs.length == 0) return
    effs[selectedEff].d = !effs[selectedEff].d
    updEff()
}
function lefEff() {
    if (effs.length == 0 && selectedEff > 0) return
    let eff1 = effs[selectedEff]
    let eff2 = effs[selectedEff-1]
    effs[selectedEff-1] = eff1
    effs[selectedEff] = eff2
    updEff()
    selEff(selectedEff-1)
}
function rigEff() {
    if (effs.length == 0 && selectedEff < effs.length - 1) return
    let eff1 = effs[selectedEff]
    let eff2 = effs[selectedEff+1]
    effs[selectedEff+1] = eff1
    effs[selectedEff] = eff2
    updEff()
    selEff(selectedEff+1)
}
function namEff() {
    if (effs.length == 0) return
    let newtitle = prompt("enter a name for the effect")
    if (newtitle == null) return
    effs[selectedEff].t = newtitle
    updEff()
}
function selEff(u,set) {
    if (effs.length == 0) return
    if (set) effs[selectedEff].c = document.getElementById("code").value
    selectedEff = u
    document.getElementById("code").value = effs[u].c
    updEff()
}
function updEff() {
    let eff = document.getElementById("eff")
    eff.innerHTML = ""
    for (let i = 0; i < effs.length; i++) {
        let e = document.createElement("button")
        let opa = effs[i].d?";opacity:50%":""
        if (i == selectedEff) {
            e.setAttribute("style","font-family:\"Consolas\",monospace;color:white;background-color:#444;border:none;outline:white solid 1px"+opa)
        } else {
            e.setAttribute("style",st+opa)
        }
        e.textContent = effs[i].t; e.onclick = () => selEff(i,true)
        eff.appendChild(e)
    }
}
updEff()
function setStatus(u) {
    document.getElementById("welcome").innerHTML = ""
    document.getElementById("status").textContent = u
}
autoRendering = false
function autoRender() {
    autoRendering = !autoRendering
    if (autoRendering) {
        document.getElementById("autorender").setAttribute("style","font-family:\"Consolas\",monospace;color:black;background-color:white;border:none;outline:white solid 1px")

    }
}
setInterval(()=>{
    if (autoRendering) {

    }
},0)
function saveSession() {
    effs[selectedEff].c = document.getElementById("code").value
    localStorage.setItem("images",JSON.stringify(imgsdata))
    localStorage.setItem("effects",JSON.stringify(effs))
    localStorage.setItem("resolution",`[${document.getElementById("width").value},${document.getElementById("height").value}]`)

}
function loadSession() {
    if (localStorage["effects"] == undefined || localStorage["resolution"] == undefined || localStorage["images"] == undefined) return
    effs = JSON.parse(localStorage["effects"])
    let resol = JSON.parse(localStorage["resolution"])

    document.getElementById("height").value = resol[1] + ""
    imgsdata = JSON.parse(localStorage["images"])
    imgs = []
    document.getElementById("images").textContent = ""
    for (let si = 0; si < imgsdata.length; si++) {
        let imgsdata_ = imgsdata[si]
    	let ik = new Image(imgsdata_.w,imgsdata_.h)
    	ik.src = imgsdata_.s
    	f.width = imgsdata_.w; f.height = imgsdata_.h
    	ff.clearRect(0,0,f.width,f.height)
    	ff.drawImage(ik,0,0,ik.width,ik.height,0,0,f.width,f.height)
        let imgs_ = ff.getImageData(0,0,f.width,f.height)
        console.log(imgs_)
        imgs.push(imgs_)
        document.getElementById("images").textContent += `(${si}) ${imgsdata_.n}: ${imgsdata_.w}x${imgsdata_.h}\n`
    }
    document.getElementById("code").value = effs[0].c
    rcanvas()
    updEff()
}
loadSession()
function exportProject() {
    effs[selectedEff].c = document.getElementById("code").value
    let project = {images:JSON.stringify(imgsdata),effects:JSON.stringify(effs),resolution:`[${document.getElementById("width").value},${document.getElementById("height").value}]`}
    project = JSON.stringify(project)

function importProject() {
    let project = document.getElementById("import").files[0]
    rdr = new FileReader()
    rdr.onload = (event) => {
        project = JSON.parse(event.target.result)
        console.log(project)
	localStorage.setItem("images", project["images"])
	localStorage.setItem("effects", project["effects"])
	localStorage.setItem("resolution", project["resolution"])
        loadSession()
    }
    rdr.readAsText(project)
    setStatus("imported project")
}

giftoggled = false
constructinggif = false
function gifExportToggle() {
    giftoggled = !giftoggled
    if (giftoggled) {
        document.getElementById("gifexport").setAttribute("style","font-family:\"Consolas\",monospace;color:black;background-color:white;border:none;outline:white solid 1px")
        document.getElementById("gifexportdo").setAttribute("style",st)
        document.getElementById("gif_frames").setAttribute("style",st+";width:80px")
        document.getElementById("gif_fps").setAttribute("style",st+";width:80px")
        document.getElementById("gif_quality").setAttribute("style",st+";width:80px")
    } else {
        document.getElementById("gifexport").setAttribute("style",st)
        document.getElementById("gifexportdo").setAttribute("style","display:none")
        document.getElementById("gif_frames").setAttribute("style","display:none")
        document.getElementById("gif_fps").setAttribute("style","display:none")
        document.getElementById("gif_quality").setAttribute("style","display:none")
    }
}
function gifExportRun() {
    if (constructinggif) {
        gifExportStop(); return
    }
    constructinggif = true
    document.getElementById("gifexportdo").textContent = "stop exporting"
    GIF = new GIFEncoder()
    GIF.setSize(Number(document.getElementById("width").value), Number(document.getElementById("height").value))
    GIF.setDelay(1e3 / Number(document.getElementById("gif_fps").value))
    GIF.setQuality(Number(document.getElementById("gif_quality").value))
    GIF.setRepeat(0)
    autoRendering = true
    GIF.start()
}
function gifExportStop() {
    GIF.finish()
    constructinggif = false; V = 1; autoRendering = false
    vg = GIF
    document.getElementById("gifexportdo").textContent = "export as gif"
    setStatus("stopped rendering gif"); rcanvas()
}

<script>
/**
 * This class lets you encode animated GIF files
 * Base class :  http://www.java2s.com/Code/Java/2D-Graphics-GUI/AnimatedGifEncoder.htm
 * @author Kevin Weiner (original Java version - kweiner@fmsware.com)
 * @author Thibault Imbert (AS3 version - bytearray.org)
 * @author Kevin Kwok (JavaScript version - https://github.com/antimatter15/jsgif)
 * @version 0.1 AS3 implementation
 */

GIFEncoder = function() {

	for (var i = 0, chr = {}; i < 256; i++)
		chr[i] = String.fromCharCode(i);

	function ByteArray() {
		this.bin = [];
	}

	ByteArray.prototype.getData = function() {
		for (var v = '', l = this.bin.length, i = 0; i < l; i++)
			v += chr[this.bin[i]];
		return v;
	};

	ByteArray.prototype.writeByte = function(val) {
		this.bin.push(val);
	};

	ByteArray.prototype.writeUTFBytes = function(string) {
		for (var l = string.length, i = 0; i < l; i++)
			this.writeByte(string.charCodeAt(i));

 */

NeuQuant = function() {

	var exports = {};
	var netsize = 256; /* number of colours used */

	/* four primes near 500 - assume no image has a length so large */
	/* that it is divisible by all four primes */

	var prime1 = 499;
	var prime2 = 491;
	var prime3 = 487;
	var prime4 = 503;
	var minpicturebytes = (3 * prime4); /* minimum size for input image */

	/*
	 * Program Skeleton ---------------- [select samplefac in range 1..30] [read
	 * image from input file] pic = (unsigned char*) malloc(3*width*height);
	 * initnet(pic,3*width*height,samplefac); learn(); unbiasnet(); [write output
	 * image header, using writecolourmap(f)] inxbuild(); write output image using
	 * inxsearch(b,g,r)
	 */

	/*
	 * Network Definitions -------------------
	 */

	var maxnetpos = (netsize - 1);
	var netbiasshift = 4; /* bias for colour values */
	var ncycles = 100; /* no. of learning cycles */

	/* defs for freq and bias */
	var intbiasshift = 16; /* bias for fractions */
	var intbias = (1 << intbiasshift);
	var gammashift = 10; /* gamma = 1024 */
	var gamma = (1 << gammashift);
	var betashift = 10;
	var beta = (intbias >> betashift); /* beta = 1/1024 */
	var betagamma = (intbias << (gammashift - betashift));

	/* defs for decreasing radius factor */
	var initrad = (netsize >> 3); /* for 256 cols, radius starts */
	var radiusbiasshift = 6; /* at 32.0 biased by 6 bits */
	var radiusbias = (1 << radiusbiasshift);
	var initradius = (initrad * radiusbias); /* and decreases by a */
	var radiusdec = 30; /* factor of 1/30 each cycle */

	/* defs for decreasing alpha factor */
	var alphabiasshift = 10; /* alpha starts at 1.0 */
	var initalpha = (1 << alphabiasshift);
	var alphadec; /* biased by 10 bits */

	/* radbias and alpharadbias used for radpower calculation */
	var radbiasshift = 8;
	var radbias = (1 << radbiasshift);
	var alpharadbshift = (alphabiasshift + radbiasshift);
	var alpharadbias = (1 << alpharadbshift);

	/*
	 * Types and Global Variables --------------------------
	 */

	var thepicture; /* the input image itself */
	var lengthcount; /* lengthcount = H*W*3 */
	var samplefac; /* sampling factor 1..30 */

	// typedef int pixel[4]; /* BGRc */
	var network; /* the network itself - [netsize][4] */
	var netindex = [];

	/* for network lookup - really 256 */
	var bias = [];

	/* bias and freq arrays for learning */
	var freq = [];
	var radpower = [];

	var NeuQuant = exports.NeuQuant = function NeuQuant(thepic, len, sample) {

		var i;
		var p;

		thepicture = thepic;
		lengthcount = len;
		samplefac = sample;

		network = new Array(netsize);

		for (i = 0; i < netsize; i++) {

			network[i] = new Array(4);
			p = network[i];
			p[0] = p[1] = p[2] = (i << (netbiasshift + 8)) / netsize;
			freq[i] = intbias / netsize; /* 1/netsize */
			bias[i] = 0;
		}
	};

	var colorMap = function colorMap() {

		var map = [];
		var index = new Array(netsize);

		for (var i = 0; i < netsize; i++)
			index[network[i][3]] = i;

		var k = 0;
		for (var l = 0; l < netsize; l++) {
			var j = index[l];
			map[k++] = (network[j][0]);
			map[k++] = (network[j][1]);
			map[k++] = (network[j][2]);
		}

		return map;
	};

	/*
	 * Insertion sort of network and building of netindex[0..255] (to do after
	 * unbias)
	 * -------------------------------------------------------------------------------
	 */

	var inxbuild = function inxbuild() {

		var i;
		var j;
		var smallpos;
		var smallval;
		var p;
		var q;
		var previouscol;
		var startpos;

		previouscol = 0;
		startpos = 0;
		for (i = 0; i < netsize; i++) {

			p = network[i];
			smallpos = i;
			smallval = p[1]; /* index on g */

			/* find smallest in i..netsize-1 */
			for (j = i + 1; j < netsize; j++) {

				q = network[j];
				if (q[1] < smallval) { /* index on g */
					smallpos = j;
					smallval = q[1]; /* index on g */
				}
			}
			q = network[smallpos];

			/* swap p (i) and q (smallpos) entries */
			if (i != smallpos) {
				j = q[0];
				q[0] = p[0];
				p[0] = j;
				j = q[1];
				q[1] = p[1];
				p[1] = j;
				j = q[2];
				q[2] = p[2];
				p[2] = j;
				j = q[3];
				q[3] = p[3];
				p[3] = j;
			}

			/* smallval entry is now in position i */

			if (smallval != previouscol) {

				netindex[previouscol] = (startpos + i) >> 1;

				for (j = previouscol + 1; j < smallval; j++) netindex[j] = i;

				previouscol = smallval;
				startpos = i;
			}
		}

		netindex[previouscol] = (startpos + maxnetpos) >> 1;
		for (j = previouscol + 1; j < 256; j++) netindex[j] = maxnetpos; /* really 256 */
	};

	/*
	 * Main Learning Loop ------------------
	 */

	var learn = function learn() {

		var i;
		var j;
		var b;
		var g;
		var r;
		var radius;
		var rad;
		var alpha;
		var step;
		var delta;
		var samplepixels;
		var p;
		var pix;
		var lim;

		if (lengthcount < minpicturebytes) samplefac = 1;

		alphadec = 30 + ((samplefac - 1) / 3);
		p = thepicture;
		pix = 0;
		lim = lengthcount;
		samplepixels = lengthcount / (3 * samplefac);
		delta = (samplepixels / ncycles) | 0;
		alpha = initalpha;
		radius = initradius;

		rad = radius >> radiusbiasshift;
		if (rad <= 1) rad = 0;

		for (i = 0; i < rad; i++) radpower[i] = alpha * (((rad * rad - i * i) * radbias) / (rad * rad));

		if (lengthcount < minpicturebytes) step = 3;

		else if ((lengthcount % prime1) !== 0) step = 3 * prime1;

		else {

			if ((lengthcount % prime2) !== 0) step = 3 * prime2;
			else {
				if ((lengthcount % prime3) !== 0) step = 3 * prime3;
				else step = 3 * prime4;
			}
		}

		i = 0;
		while (i < samplepixels) {

			b = (p[pix + 0] & 0xff) << netbiasshift;
			g = (p[pix + 1] & 0xff) << netbiasshift;
			r = (p[pix + 2] & 0xff) << netbiasshift;
			j = contest(b, g, r);

			altersingle(alpha, j, b, g, r);
			if (rad !== 0) alterneigh(rad, j, b, g, r); /* alter neighbours */

			pix += step;
			if (pix >= lim) pix -= lengthcount;

			i++;

			if (delta === 0) delta = 1;

			if (i % delta === 0) {
				alpha -= alpha / alphadec;
				radius -= radius / radiusdec;
				rad = radius >> radiusbiasshift;

				if (rad <= 1) rad = 0;

				for (j = 0; j < rad; j++) radpower[j] = alpha * (((rad * rad - j * j) * radbias) / (rad * rad));
			}
		}
	};

	/*
	 ** Search for BGR values 0..255 (after net is unbiased) and return colour
	 * index
	 * ----------------------------------------------------------------------------
	 */

	var map = exports.map = function map(b, g, r) {

		var i;
		var j;
		var dist;
		var a;
		var bestd;
		var p;
		var best;

		bestd = 1000; /* biggest possible dist is 256*3 */
		best = -1;
		i = netindex[g]; /* index on g */
		j = i - 1; /* start at netindex[g] and work outwards */

		while ((i < netsize) || (j >= 0)) {

			if (i < netsize) {
				p = network[i];
				dist = p[1] - g; /* inx key */

				if (dist >= bestd) i = netsize; /* stop iter */

				else {

					i++;
					if (dist < 0) dist = -dist;
					a = p[0] - b;
					if (a < 0) a = -a;
					dist += a;

					if (dist < bestd) {
						a = p[2] - r;
						if (a < 0) a = -a;
						dist += a;

						if (dist < bestd) {
							bestd = dist;
							best = p[3];
						}
					}
				}
			}

			if (j >= 0) {

				p = network[j];
				dist = g - p[1]; /* inx key - reverse dif */

				if (dist >= bestd) j = -1; /* stop iter */

				else {

					j--;
					if (dist < 0) dist = -dist;
					a = p[0] - b;
					if (a < 0) a = -a;
					dist += a;

					if (dist < bestd) {
						a = p[2] - r;
						if (a < 0) a = -a;
						dist += a;
						if (dist < bestd) {
							bestd = dist;
							best = p[3];
						}
					}
				}
			}
		}

		return (best);
	};

	var process = exports.process = function process() {
		learn();
		unbiasnet();
		inxbuild();
		return colorMap();
	};

	/*
	 * Unbias network to give byte values 0..255 and record position i to prepare
	 * for sort
	 * -----------------------------------------------------------------------------------
	 */

	var unbiasnet = function unbiasnet() {

		var i;
		var j;

		for (i = 0; i < netsize; i++) {
			network[i][0] >>= netbiasshift;
			network[i][1] >>= netbiasshift;
			network[i][2] >>= netbiasshift;
			network[i][3] = i; /* record colour no */
		}
	};

	/*
	 * Move adjacent neurons by precomputed alpha*(1-((i-j)^2/[r]^2)) in
	 * radpower[|i-j|]
	 * ---------------------------------------------------------------------------------
	 */

	var alterneigh = function alterneigh(rad, i, b, g, r) {

		var j;
		var k;
		var lo;
		var hi;
		var a;
		var m;
		var p;

		lo = i - rad;
		if (lo < -1) lo = -1;

		hi = i + rad;
		if (hi > netsize) hi = netsize;

		j = i + 1;
		k = i - 1;
		m = 1;

		while ((j < hi) || (k > lo)) {
			a = radpower[m++];

			if (j < hi) {
				p = network[j++];

				try {
					p[0] -= (a * (p[0] - b)) / alpharadbias;
					p[1] -= (a * (p[1] - g)) / alpharadbias;
					p[2] -= (a * (p[2] - r)) / alpharadbias;
				} catch (e) {} // prevents 1.3 miscompilation
			}

			if (k > lo) {
				p = network[k--];

				try {
					p[0] -= (a * (p[0] - b)) / alpharadbias;
					p[1] -= (a * (p[1] - g)) / alpharadbias;
					p[2] -= (a * (p[2] - r)) / alpharadbias;
				} catch (e) {}
			}
		}
	};

	/*
	 * Move neuron i towards biased (b,g,r) by factor alpha
	 * ----------------------------------------------------
	 */

	var altersingle = function altersingle(alpha, i, b, g, r) {

		/* alter hit neuron */
		var n = network[i];
		n[0] -= (alpha * (n[0] - b)) / initalpha;
		n[1] -= (alpha * (n[1] - g)) / initalpha;
		n[2] -= (alpha * (n[2] - r)) / initalpha;
	};

	/*
	 * Search for biased BGR values ----------------------------
	 */

	var contest = function contest(b, g, r) {

		/* finds closest neuron (min dist) and updates freq */
		/* finds best neuron (min dist-bias) and returns position */
		/* for frequently chosen neurons, freq[i] is high and bias[i] is negative */
		/* bias[i] = gamma*((1/netsize)-freq[i]) */

		var i;
		var dist;
		var a;
		var biasdist;
		var betafreq;
		var bestpos;
		var bestbiaspos;
		var bestd;
		var bestbiasd;
		var n;

		bestd = ~ (1 << 31);
		bestbiasd = bestd;
		bestpos = -1;
		bestbiaspos = bestpos;

		for (i = 0; i < netsize; i++) {
			n = network[i];
			dist = n[0] - b;
			if (dist < 0) dist = -dist;
			a = n[1] - g;
			if (a < 0) a = -a;
			dist += a;
			a = n[2] - r;
			if (a < 0) a = -a;
			dist += a;

			if (dist < bestd) {
				bestd = dist;
				bestpos = i;
			}

			biasdist = dist - ((bias[i]) >> (intbiasshift - netbiasshift));

			if (biasdist < bestbiasd) {
				bestbiasd = biasdist;
				bestbiaspos = i;
			}

			betafreq = (freq[i] >> betashift);
			freq[i] -= betafreq;
			bias[i] += (betafreq << gammashift);
		}

		freq[bestpos] += beta;
		bias[bestpos] -= betagamma;
		return (bestbiaspos);
	};

	NeuQuant.apply(this, arguments);
	return exports;
};
</script>
